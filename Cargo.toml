[workspace]
members = ["crates/widescope-core", "crates/widescope-cli"]
# src-tauri is its own workspace (heavy Tauri deps) — keep it out of the
# lightweight `cargo check --workspace` CI. Build it with `just tauri-build`.
exclude = ["src-tauri"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
