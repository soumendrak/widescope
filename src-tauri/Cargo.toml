[package]
name = "widescope-desktop"
version = "0.1.0"
edition = "2021"
description = "WideScope — native desktop shell for the LLM trace viewer"

# Standalone workspace on purpose: the root workspace's fast Rust CI
# (`cargo check --workspace`) must NOT pull in Tauri's heavy build deps.
# Build the desktop app explicitly with `just tauri-build`.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
# Enabled by the Tauri CLI for production bundles.
custom-protocol = ["tauri/custom-protocol"]
