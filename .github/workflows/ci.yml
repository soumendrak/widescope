name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Raise these when coverage rises; never lower them to make a build pass.
  RUST_COVERAGE_MIN: "98"

jobs:
  rust:
    name: Rust — check, clippy, test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: cargo check
      run: cargo check --workspace

    - name: cargo clippy
      run: cargo clippy --workspace -- -D warnings

    - name: cargo test
      run: cargo test --workspace

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    # The gate is the point of the coverage work: a PR that drops a line below
    # this fails here rather than in a review comment six months later.
    - name: Coverage gate
      run: cargo llvm-cov --workspace --summary-only --fail-under-lines ${{ env.RUST_COVERAGE_MIN }}

  ui:
    name: UI — unit + e2e
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0

    - name: Build WASM
      run: wasm-pack build crates/widescope-core --target web --out-dir pkg

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install UI deps
      working-directory: ui
      run: npm ci

    - name: Unit tests + coverage gate (vitest)
      working-directory: ui
      # Thresholds live in the vitest config so `npm test` fails locally too.
      run: npx vitest run --coverage

    - name: Install Playwright browser
      working-directory: ui
      run: npx playwright install --with-deps chromium

    - name: E2E tests (Playwright)
      working-directory: ui
      run: npm run e2e

