name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  standards:
    name: Standards (just check)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy, rustfmt, llvm-tools-preview

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - uses: taiki-e/install-action@v2
      with:
        tool: just,cargo-llvm-cov,wasm-pack

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - run: just ui-install

    - name: just check
      run: just check "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

  e2e:
    name: E2E (just e2e)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - uses: taiki-e/install-action@v2
      with:
        tool: just,wasm-pack

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - run: just ui-install

    - name: Install Playwright browser
      working-directory: ui
      run: npx playwright install --with-deps chromium

    - run: just e2e
